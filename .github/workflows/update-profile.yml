name: Update profile

on:
  schedule:
    - cron: "17 6,18 * * *"   # twice a day: 06:17 and 18:17 UTC (03:17 and 15:17 in Brasília)
  workflow_dispatch:
  push:
    branches: [main]   # any push here; the bot's own "Refresh profile" push doesn't retrigger (GITHUB_TOKEN pushes never do)

permissions:
  contents: write

concurrency:
  group: update-profile
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install fonttools==4.62.1
      - name: Fetch data
        env:
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python tools/profile/fetch.py
      - name: Render SVGs
        run: python tools/profile/render.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets tools/profile/data
          if git diff --cached --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Refresh profile"
            git push
          fi
